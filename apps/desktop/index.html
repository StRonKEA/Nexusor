<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141414" />
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background-color: var(--vscode-editor-background, var(--startup-background, #141414));
      }
    </style>
    <script>
      (() => {
        try {
          const background = "#0b0c0e";
          document.documentElement.dataset.theme = "default-dark";
          document.documentElement.style.setProperty("--startup-background", background);
          document.documentElement.style.colorScheme = "dark";
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", background);
        } catch {
          // The inline CSS already provides the dark-theme fallback.
        }
      })();
    </script>
    <title>Nexusor</title>
    <link rel="icon" type="image/png" href="/src/assets/app-icon.png" />
  </head>

  <body>
    <noscript>Nexusor requires JavaScript to run.</noscript>
    <div id="root"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
