name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/desktop/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Rust dependencies & build tools
        run: |
          npm install -g @tauri-apps/cli

      - name: Install Desktop Frontend dependencies
        run: |
          cd apps/desktop
          npm ci

      - name: Build Standalone Server & Tauri Desktop Installer
        run: |
          cargo build --release -p cursor-server
          cd apps/desktop
          npx tauri build

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexusor-Windows-Setup
          path: target/release/bundle/nsis/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
